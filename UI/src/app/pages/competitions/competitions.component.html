
<!-- <p class="text-muted">A card is a flexible and extensible content container. It includes options for headers and footers, a wide variety of content, contextual background colors, and powerful display options. Cards require a small amount of markup and classes to provide you with as much control as possible. These classes and markup are flexible though and can typically be remixed and extended with ease. For example, if your card has no flush content like images, feel free to put the <code>.card-body</code> class on the <code>.card</code> element to consolidate your markup.</p> -->
<div class="row w-100 text-center">
    <h2 class="mb-2 mt-2 w-100 text-center">Elenco Gare CSEN Veneto</h2>           
</div>

<div class="row mb-3 mt-3">
    <button class="btn btn-primary box-shadow mb-3 ml-3" (click)="addCompetition()">
        <i class="fa fa-plus mr-2"></i>
        Aggiungi Competizione
    </button>
           
</div>
<div widget class="card border-0 box-shadow mt-3">

    <div class="card-body widget-body">
        <div class="table-responsive">
            <ng2-smart-table  class="table table-hover"
                              [settings]="settings" 
                              [source]="data" 
                              (custom)="onCustom($event)"></ng2-smart-table>
        </div>          
    </div>
</div>
