<div class="p-4" style="background-color: #f8f9fa; min-height: 100vh;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="font-weight-bold text-dark mb-0">Nuova Competizione</h3>
            <p class="text-muted small">Inserisci i dettagli per pubblicare un nuovo evento</p>
        </div>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" routerLink="/competitions">
            <i class="fa fa-arrow-left mr-1"></i> Torna alla lista
        </button>
    </div>

    <form [formGroup]="requestForm" (ngSubmit)="onSubmit(requestForm.value)">
        <div class="row">
            
            <div class="col-lg-8">
                
                <div class="card border-0 box-shadow-sm rounded-lg mb-4">
                    <div class="card-header bg-white border-0 pt-4 pb-0">
                        <h5 class="font-weight-bold"><i class="fa fa-user text-primary mr-2"></i>Informazioni Responsabile</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="form-group col-md-6">
                                <label class="small font-weight-bold text-muted text-uppercase">Nome e Cognome</label>
                                <input formControlName="name" class="form-control form-control-modern" type="text" placeholder="Es: Mario Rossi">
                            </div>
                            <div class="form-group col-md-6">
                                <label class="small font-weight-bold text-muted text-uppercase">Società Organizzatrice</label>
                                <input formControlName="companyName" class="form-control form-control-modern" type="text" placeholder="Nome ASD">
                            </div>
                            <div class="form-group col-md-6">
                                <label class="small font-weight-bold text-muted text-uppercase">Email di Contatto</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-light border-0"><i class="fa fa-envelope-o"></i></span>
                                    </div>
                                    <input formControlName="email" class="form-control form-control-modern" type="email">
                                </div>
                            </div>
                            <div class="form-group col-md-6">
                                <label class="small font-weight-bold text-muted text-uppercase">Telefono</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-light border-0"><i class="fa fa-phone"></i></span>
                                    </div>
                                    <input formControlName="telefono" class="form-control form-control-modern" type="text">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 box-shadow-sm rounded-lg mb-4">
                    <div class="card-header bg-white border-0 pt-4 pb-0">
                        <h5 class="font-weight-bold"><i class="fa fa-trophy text-warning mr-2"></i>Dettagli Gara</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="form-group col-md-4">
                                <label class="small font-weight-bold text-muted text-uppercase">ID Gara</label>
                                <input formControlName="id" class="form-control form-control-modern font-weight-bold" type="text">
                            </div>
                            <div class="form-group col-md-8">
                                <label class="small font-weight-bold text-muted text-uppercase">Titolo Manifestazione</label>
                                <input formControlName="competitionName" class="form-control form-control-modern font-weight-bold" type="text">
                            </div>
                            <div class="form-group col-md-4">
                                <label class="small font-weight-bold text-muted text-uppercase">Luogo</label>
                                <input formControlName="place" class="form-control form-control-modern" type="text">
                            </div>
                            <div class="form-group col-md-4">
                                <label class="small font-weight-bold text-muted text-uppercase">Atleti Stimati</label>
                                <input formControlName="n_athletes" class="form-control form-control-modern" type="number">
                            </div>
                            <div class="form-group col-md-4">
                                <label class="small font-weight-bold text-muted text-uppercase">Data Evento</label>
                                <div class="input-group">
                                    <input class="form-control form-control-modern" placeholder="GG-MM-AAAA"
                                        name="dpGara" formControlName="competitionDate" ngbDatepicker #dG="ngbDatepicker">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary border-0 bg-light" (click)="dG.toggle()" type="button">
                                            <i class="fa fa-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group col-md-4">
                                <label class="small font-weight-bold text-muted text-uppercase">Apertura Iscrizioni</label>
                                <div class="input-group">
                                    <input class="form-control form-control-modern" placeholder="GG-MM-AAAA"
                                        name="dpApertura" formControlName="registrationOpen" ngbDatepicker #dA="ngbDatepicker">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary border-0 bg-light" (click)="dA.toggle()" type="button">
                                            <i class="fa fa-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group col-md-4">
                                <label class="small font-weight-bold text-muted text-uppercase">Chiusura Iscrizioni</label>
                                <div class="input-group">
                                    <input class="form-control form-control-modern" placeholder="GG-MM-AAAA"
                                        name="dpChiusura" formControlName="registrationClose" ngbDatepicker #dC="ngbDatepicker">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary border-0 bg-light" (click)="dC.toggle()" type="button">
                                            <i class="fa fa-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 box-shadow-sm rounded-lg mb-4">
                    <div class="card-header bg-white border-0 pt-4 pb-0">
                        <h5 class="font-weight-bold"><i class="fa fa-cloud-upload text-info mr-2"></i>Documentazione</h5>
                    </div>
                    <div class="card-body">
                        <div class="upload-box mb-3" [class.has-file]="locandina">
                            <label class="small font-weight-bold text-muted text-uppercase d-block">Locandina (Immagine)</label>
                            <div class="drop-zone p-3 text-center border rounded">
                                <input type="file" (change)="locandinaChange($event)" #inputLoc class="file-input" />
                                <div *ngIf="!locandina">
                                    <i class="fa fa-image fa-2x text-light mb-2"></i>
                                    <p class="small text-muted m-0">Trascina o clicca per caricare</p>
                                </div>
                                <div *ngIf="locandina" class="d-flex align-items-center justify-content-between">
                                    <span class="small text-truncate mr-2">{{locandina}}</span>
                                    <i class="fa fa-times text-danger cursor-pointer" (click)="removeLocandina()"></i>
                                </div>
                            </div>
                        </div>

                        <div class="upload-box mb-4" [class.has-file]="circolare">
                            <label class="small font-weight-bold text-muted text-uppercase d-block">Circolare (PDF)</label>
                            <div class="drop-zone p-3 text-center border rounded">
                                <input type="file" (change)="circolareChange($event)" #inputCirc class="file-input" />
                                <div *ngIf="!circolare">
                                    <i class="fa fa-file-pdf-o fa-2x text-light mb-2"></i>
                                    <p class="small text-muted m-0">Trascina o clicca per caricare</p>
                                </div>
                                <div *ngIf="circolare" class="d-flex align-items-center justify-content-between">
                                    <span class="small text-truncate mr-2">{{circolare}}</span>
                                    <i class="fa fa-times text-danger cursor-pointer" (click)="removeCircolare()"></i>
                                </div>
                            </div>
                        </div>

                        <hr>

                        <button [disabled]="!requestForm.valid" class="btn btn-primary btn-block btn-lg rounded-pill shadow hover-lift mt-3 py-3 font-weight-bold" type="submit">
                            PUBBLICA GARA <i class="fa fa-paper-plane ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<ng-template #modalContent>
    <div class="modal-body text-center p-5">
        <div class="mb-4">
            <i class="fa fa-check-circle fa-5x text-success"></i>
        </div>
        
        <p class="text-muted">Gara inserita correttamente.</p>
        <button type="button" class="btn btn-success btn-lg rounded-pill px-5 mt-3" (click)="closeModal()">Chiudi</button>
    </div>
</ng-template>
