<div class="row">
    <div class="col-lg-9 mb-4">
        <div widget class="card border-0 box-shadow">
            <div class="card-body pt-0 widget-body">
                <div class="row mt-4">
                    <div class="col-md-8">
                        <form #m="ngForm" class="form-horizontal mb-4" (ngSubmit)="updateEmail(m.value)">
                                <h2 class="mt-3 mb-3">Cambio Email</h2>
                            <div class="form-group col-md-12">
                                <div class="form-group">
                                    <label class="form-control-label">Email</label>
                                    <input type="text" name="email" class="form-control" [(ngModel)]="user.email" required reverse="true">
                                </div>
                            </div>
                            <button class="btn-custom btn btn-primary mx-auto"  type="submit" [disabled]="m.form.invalid" style="float: right;" >Salva
                                email</button>
                        </form>
                        <form #f="ngForm" class="form-horizontal" (ngSubmit)="changePassword(f.value)">
                            <h2 class="mt-4 mb-3">Cambio Password</h2>
                            <div class="form-group col-md-12">
                                <div class="form-group">
                                    <label class="form-control-label">Password</label>
                                    <input type="password" name="password" class="form-control" [(ngModel)]="password" required reverse="true">
                                </div>
                            </div>
                            <div class="form-group col-md-12">
                                <div class="form-group">
                                    <label class="form-control-label">Conferma Password</label>
                                    <input type="password" class="form-control" name="confirmPassword" [(ngModel)]="confirmPassword" required reverse="false"
                                        #confirmPasswordModel="ngModel">
                                    <small *ngIf="notConfirmPsw" class="text-danger">
                                        Le password non corrispondono
                                    </small>
                                </div>
                            </div>
                            <button class="btn-custom btn btn-primary" type="submit" [disabled]="f.form.invalid" style="float: right;" >Cambia
                                Password</button>
                        </form>
                    </div>

                    <div class="col-12 mt-4">
                        <div class="form-group">                        
                            <div *ngFor="let item of squadraCorrente.componenti" class="custom-control custom-checkbox checkbox-circle">
                                <input type="checkbox" class="custom-control-input checkbox-dark-gray" [id]="item.nome" [(ngModel)]="item.checked">
                                <label class="custom-control-label" [for]="item.nome">{{item.nome}}</label>
                            </div>
                        </div>
                    </div>
                </div> -->
                </div>

            </div>
        </div>

    </div>
</div>
