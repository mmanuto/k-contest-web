<div class="row">

    <div class="col-lg-12 mb-4">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0 text-dark font-weight-bold">I Miei Atleti in Gara</h5>
            
            <div class="d-none d-md-flex align-items-center text-muted">
                <span class="mr-3"><i class="fa fa-clock-o text-warning mr-1"></i> Assegnata</span>
                <span class="mr-3"><i class="fa fa-play-circle text-success mr-1"></i> In corso</span>
                <span><i class="fa fa-check-circle text-info mr-1"></i> Conclusa</span>
            </div>
        </div>
        
        <div class="d-flex d-md-none justify-content-center align-items-center text-muted mb-3 pb-2 border-bottom">
            <span class="mr-3"><i class="fa fa-clock-o text-warning mr-1"></i>Assegnata</span>
            <span class="mr-3"><i class="fa fa-play-circle text-success mr-1"></i>In corso</span>
            <span><i class="fa fa-check-circle text-info mr-1"></i>Conclusa</span>
        </div>

        <div class="row">
            
            <div *ngIf="groupedIscritti.length == 0" class="col-12 text-center mt-4">
                <div class="alert alert-light text-muted border">
                    <i class="fa fa-info-circle mr-2"></i>Nessun atleta iscritto alla manifestazione.
                </div>
            </div>

            <div class="col-md-6 col-xl-4 mb-4" *ngFor="let group of groupedIscritti">
                <div class="card h-100 shadow-sm tatami-card" 
                     [ngClass]="{
                        'tatami-todo': group.tatami && group.tatami_status == 'CAT_TODO',
                        'tatami-doing': group.tatami && group.tatami_status == 'CAT_DOING',
                        'tatami-done': group.tatami && group.tatami_status == 'CAT_DONE'
                     }">
                    
                    <div class="card-header bg-white d-flex justify-content-between align-items-start pt-3 pb-2 border-bottom-0">
                        <h6 class="font-weight-bold mb-0 text-dark pr-2" style="line-height: 1.4; font-size: 0.95rem;">
                            {{group.titolo}}
                        </h6>
                        <div>
                            <ng-container *ngIf="group.tatami">
                                <span *ngIf="group.tatami_status == 'CAT_TODO'" class="badge badge-warning text-dark px-2 py-1 shadow-sm text-nowrap" [ngClass]="{'blink-animation': group.isNewTatami}">
                                    <i class="fa fa-clock-o mr-1"></i>Tatami {{group.tatami}}
                                </span>
                                <span *ngIf="group.tatami_status == 'CAT_DOING'" class="badge badge-success px-2 py-1 shadow-sm text-nowrap" [ngClass]="{'blink-animation': group.isNewTatami}">
                                    <i class="fa fa-play-circle mr-1"></i>Tatami {{group.tatami}}
                                </span>
                                <span *ngIf="group.tatami_status == 'CAT_DONE'" class="badge badge-info text-white px-2 py-1 shadow-sm text-nowrap" [ngClass]="{'blink-animation': group.isNewTatami}">
                                    <i class="fa fa-check-circle mr-1"></i>Tatami {{group.tatami}}
                                </span>
                                <span *ngIf="group.tatami_status != 'CAT_TODO' && group.tatami_status != 'CAT_DOING' && group.tatami_status != 'CAT_DONE'" class="badge badge-primary px-2 py-1 shadow-sm text-nowrap" [ngClass]="{'blink-animation': group.isNewTatami}">
                                    Tatami {{group.tatami}}
                                </span>
                            </ng-container>

                            <span *ngIf="!group.tatami" class="badge badge-light text-muted px-2 py-1 border text-nowrap">
                                In attesa
                            </span>
                        </div>
                    </div>

                    <div class="card-body p-0 pt-2 pb-2">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item border-0 py-1 px-3 d-flex justify-content-between align-items-center" *ngFor="let atleta of group.atleti">
                                <span class="text-truncate mr-2" style="font-size: 0.9rem;">
                                    <i class="fa fa-user text-secondary mr-2" style="opacity: 0.5;"></i>{{atleta.nome}}
                                </span>
                                <small class="text-muted text-nowrap">{{atleta.data_nascita}}</small>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
