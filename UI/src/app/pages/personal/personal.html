<div class="row mb-4">
    
    <div class="col-12 mb-4 mt-4">
        <h3 class="font-weight-bold text-dark mb-1">
            <i class="fa fa-cogs text-primary mr-2"></i>Impostazioni Società
        </h3>
        <p class="text-muted">Aggiorna i dati e i contatti ufficiali del tuo club.</p>
    </div>

    <div class="col-xl-8 col-lg-10">
        <div class="card border-0 box-shadow rounded-lg bg-white overflow-hidden">
            <div class="card-header bg-dark text-white border-0 py-3">
                <h5 class="mb-0 font-weight-bold"><i class="fa fa-building-o mr-2"></i>Profilo Società</h5>
            </div>
            
            <div class="card-body p-4 p-md-5 bg-white">
                <form #m="ngForm" (ngSubmit)="updateDates(m.value)" class="row">
                    
                    <div class="col-md-6 mb-4">
                        <label class="font-weight-bold text-dark small text-uppercase">Email di Contatto *</label>
                        <div class="input-group input-group-modern">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light border-right-0 text-muted"><i class="fa fa-envelope"></i></span>
                            </div>
                            <input type="email" name="email" class="form-control border-left-0 pl-0 bg-light" [(ngModel)]="club.mail" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="font-weight-bold text-dark small text-uppercase">Telefono *</label>
                        <div class="input-group input-group-modern">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light border-right-0 text-muted"><i class="fa fa-phone"></i></span>
                            </div>
                            <input type="text" name="phone" class="form-control border-left-0 pl-0 bg-light" [(ngModel)]="club.telephone_n" required>
                        </div>
                    </div>

                    <div class="col-12 mb-4">
                        <label class="font-weight-bold text-dark small text-uppercase">Nome Società *</label>
                        <div class="input-group input-group-modern">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light border-right-0 text-muted"><i class="fa fa-shield"></i></span>
                            </div>
                            <input type="text" name="society" class="form-control border-left-0 pl-0 bg-light font-weight-bold text-dark" [(ngModel)]="club.club_name" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="font-weight-bold text-dark small text-uppercase">Responsabile *</label>
                        <div class="input-group input-group-modern">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light border-right-0 text-muted"><i class="fa fa-user-circle"></i></span>
                            </div>
                            <input type="text" name="name" class="form-control border-left-0 pl-0 bg-light" [(ngModel)]="club.club_manager" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="font-weight-bold text-dark small text-uppercase">Coach Ufficiale *</label>
                        <div class="input-group input-group-modern">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light border-right-0 text-muted"><i class="fa fa-bullhorn"></i></span>
                            </div>
                            <input type="text" name="coach" class="form-control border-left-0 pl-0 bg-light" [(ngModel)]="club.coach" required>
                        </div>
                    </div>

                    <div class="col-12 text-right mt-2 pt-4 border-top">
                        <button class="btn btn-primary btn-lg rounded-pill px-5 hover-lift box-shadow" type="submit" [disabled]="m.form.invalid">
                            <i class="fa fa-save mr-2"></i> Salva Modifiche
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</div>
