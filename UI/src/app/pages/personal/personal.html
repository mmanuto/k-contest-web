                                <div class="form-group">
                                    <label class="form-control-label">Nome società</label>
                                    <input type="text" name="society" class="form-control" [(ngModel)]="club.club_name" required reverse="true">
                                </div>
                            </div>
                            <div class="form-group col-md-12">
                                <div class="form-group">
                                    <label class="form-control-label">Responsabile</label>
                                    <input type="text" name="name" class="form-control" [(ngModel)]="club.club_manager" required reverse="true">
                                </div>
                            </div>
                            <div class="form-group col-md-12">
                                <div class="form-group">
                                    <label class="form-control-label">Telefono</label>

                                </div>
                            </div>
                            <div class="form-group col-md-12">
                                <div class="form-group">
                                    <label class="form-control-label">Coach</label>

                                </div>
                            </div>
                            <button class="btn-custom btn btn-primary mx-auto"  type="submit" [disabled]="m.form.invalid" style="float: right;" >Salva
